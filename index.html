<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Master Genius</title>
    
    <!-- Tailwind CSS (via CDN for standalone usage) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Tailwind Configuration to match specific theme colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0B0F19',
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        
        /* Glassmorphism Utilities */
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        body { background-color: #0B0F19; color: #f1f5f9; overflow: hidden; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="glass z-20 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-2">
            <i data-lucide="terminal" class="text-emerald-400"></i>
            <h1 class="text-xl font-bold tracking-wider text-white">PROMPT MASTER <span class="text-emerald-400 text-xs align-top font-mono">HTML</span></h1>
        </div>
        
        <div class="flex gap-2">
            <!-- Mobile Toggle -->
            <button onclick="toggleMobilePreview()" class="lg:hidden p-2 bg-white/5 rounded-md text-emerald-400 border border-white/10">
                <i data-lucide="eye"></i>
            </button>
            
            <button onclick="downloadOutput()" class="flex items-center gap-2 bg-white/5 hover:bg-white/10 text-slate-300 px-3 py-2 rounded-md text-sm font-medium border border-white/10 transition-colors">
                <i data-lucide="download" class="w-4 h-4"></i> <span class="hidden md:inline">Download</span>
            </button>
            
            <button onclick="copyToClipboard()" class="flex items-center gap-2 bg-emerald-600/80 hover:bg-emerald-500/80 text-white px-4 py-2 rounded-md text-sm font-medium backdrop-blur-sm shadow-[0_0_15px_rgba(16,185,129,0.3)] transition-colors">
                <i data-lucide="copy" class="w-4 h-4"></i> <span class="hidden sm:inline">Copy</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar Navigation -->
        <nav class="w-20 glass flex flex-col items-center py-6 gap-6 z-10 overflow-y-auto scrollbar-none shrink-0" id="nav-container">
            <!-- Navigation items injected by JS -->
        </nav>

        <!-- Main Content -->
        <main class="flex-1 flex overflow-hidden relative">
            
            <!-- Ambient Glow Background -->
            <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
                <div id="ambient-glow" class="absolute -top-1/4 -left-1/4 w-1/2 h-1/2 rounded-full opacity-10 blur-[120px] transition-colors duration-700 bg-cyan-600"></div>
            </div>

            <!-- Editor Column -->
            <div class="flex-1 p-4 md:p-8 overflow-y-auto scrollbar-thin z-10 pb-24" id="editor-container">
                <!-- Custom Input Bar -->
                <div class="mb-8 p-1 rounded-xl bg-gradient-to-r from-white/5 to-white/0 border border-white/10 backdrop-blur-md">
                    <div class="p-4 flex gap-2">
                        <input type="text" id="custom-input" placeholder="Add custom detail..." class="flex-1 bg-black/30 border border-white/10 rounded-lg px-4 py-3 text-sm focus:outline-none text-white transition-colors">
                        <button onclick="handleCustomAdd()" class="bg-white/10 hover:bg-white/20 p-2 rounded-lg text-white transition-colors">
                            <i data-lucide="plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Dynamic Form Sections injected by JS -->
                <div id="form-content" class="space-y-8"></div>
            </div>

            <!-- Preview Column (Desktop) -->
            <div class="w-96 glass-panel backdrop-blur-xl p-6 hidden lg:flex flex-col z-20 border-l-0 border-r-0 border-b-0 border-t-0 border-white/10">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xs font-bold text-white/50 uppercase tracking-[0.2em]">Output</h2>
                    <div class="flex bg-white/5 rounded-lg p-1 border border-white/10">
                        <button onclick="setOutputMode('text')" id="btn-mode-text" class="px-3 py-1 text-[10px] font-bold rounded-md uppercase tracking-wide transition-all bg-white/10 text-white">Text</button>
                        <button onclick="setOutputMode('json')" id="btn-mode-json" class="px-3 py-1 text-[10px] font-bold rounded-md uppercase tracking-wide transition-all text-white/40">JSON</button>
                    </div>
                </div>
                
                <div class="flex-1 glass-panel rounded-xl p-5 overflow-auto relative group shadow-inner">
                    <div id="preview-content" class="font-sans text-sm text-slate-300 leading-relaxed whitespace-pre-wrap"></div>
                </div>
                
                <div class="mt-4 flex items-center justify-center gap-2 text-[10px] text-white/30 uppercase tracking-wider">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-white"></div>
                    <span id="status-text">Generator Ready</span>
                </div>
            </div>

            <!-- Mobile Preview Overlay (Hidden by default) -->
            <div id="mobile-preview" class="hidden absolute inset-0 z-50 bg-[#0B0F19]/95 backdrop-blur-xl p-6 flex flex-col animate-fade-in">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-bold text-white uppercase tracking-[0.2em]">Preview</h2>
                    <button onclick="toggleMobilePreview()" class="p-2 bg-white/10 rounded-full"><i data-lucide="x"></i></button>
                </div>
                <div class="flex-1 glass-panel rounded-xl p-6 overflow-auto shadow-inner">
                    <div id="mobile-preview-content" class="text-slate-300 text-sm whitespace-pre-wrap"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- Application Logic -->
    <script>
        // --- State Management ---
        let state = {
            activeTab: 'scene',
            outputMode: 'text',
            presets: {},
            data: {}
        };

        const defaultPresets = {
            scene: {
                setting: ["Cyberpunk City", "Medieval Forest", "Space Station", "Desert Oasis", "Abandoned Hospital", "Luxury Apartment"],
                details: ["Neon Lights", "Foggy", "Raining", "Crumbling Walls", "Overgrown Vegetation", "Holographic Signs"],
                pacing: ["Slow", "Fast-paced", "Chaotic", "Serene", "Suspenseful"]
            },
            camera: {
                composition: ["Wide Shot", "Close-up", "Low Angle", "High Angle", "Dutch Angle", "Over-the-shoulder", "Macro"],
                lens: ["35mm Anamorphic", "50mm Prime", "85mm Portrait", "Fisheye", "Telephoto", "16mm Film"],
                depth: ["Bokeh", "Shallow Depth of Field", "Deep Focus", "Motion Blur", "Sharp Focus"]
            },
            style: {
                medium: ["Photography", "3D Render", "Oil Painting", "Digital Illustration", "Polaroid", "Concept Art", "Claymation", "Line Art"],
                visualStyle: ["Noir", "Vaporwave", "Gothic", "Steampunk", "Cybernetic", "Minimalist"],
                artist: ["Greg Rutkowski", "Syd Mead", "Miyazaki", "Roger Deakins", "Zdzisław Beksiński", "Wes Anderson Style"],
                lighting: {
                    time: ["Dawn", "Morning", "High Noon", "Afternoon", "Golden Hour", "Dusk", "Blue Hour", "Midnight"],
                    mood: ["Mysterious", "Romantic", "Sterile", "Ominous", "Hopeful", "Cinematic"],
                    palette: ["Teal & Orange", "Neon & Black", "Pastel", "Monochrome", "Warm Earth Tones"] 
                },
                filter: ["Film Grain", "Chromatic Aberration", "Vignette", "Sepia", "High Contrast", "Glitch Effect"]
            },
            actors: {
                quantity: ["Solo", "Duo", "Trio", "Crowd", "Army"],
                appearance: ["Tall", "Muscular", "Cybernetic", "Ethereal", "Scarred", "Glowing", "Tattooed"],
                clothes: ["Trench Coat", "Space Suit", "Medieval Armor", "Streetwear", "Robes", "Tactical Gear"]
            },
            negative: ["Blurry", "Low Quality", "Distorted", "Watermark", "Bad Anatomy", "Text", "Cropped", "Ugly"]
        };

        const defaultData = {
            scene: { description: "", environment: { setting: "", details: "" }, pacing: "" },
            camera: { composition: "", lens: "", depth_of_field: "" },
            style: { medium: "", visualStyle: "", artist: "", lighting: { time_of_day: "", mood: "", colorPalette: "" }, filter: "" },
            actors: [{ id: "actor_01", description: "", action: "" }],
            negative_prompt: ""
        };

        const tabConfig = {
            scene: { color: 'text-cyan-400', bg: 'bg-cyan-600', icon: 'clapperboard' },
            camera: { color: 'text-purple-400', bg: 'bg-purple-600', icon: 'camera' },
            style: { color: 'text-pink-400', bg: 'bg-pink-600', icon: 'palette' },
            actors: { color: 'text-yellow-400', bg: 'bg-yellow-600', icon: 'users' },
            negative: { color: 'text-red-400', bg: 'bg-red-600', icon: 'ban' }
        };

        // --- Initialization ---
        function init() {
            // Load from LocalStorage
            try {
                const savedPresets = localStorage.getItem('pm_genius_presets_v3');
                const savedData = localStorage.getItem('pm_genius_data_v3');
                
                state.presets = savedPresets ? JSON.parse(savedPresets) : JSON.parse(JSON.stringify(defaultPresets));
                state.data = savedData ? JSON.parse(savedData) : JSON.parse(JSON.stringify(defaultData));
            } catch (e) {
                console.error("Load error", e);
                state.presets = defaultPresets;
                state.data = defaultData;
            }

            renderApp();
            
            // Listen for Enter key on custom input
            document.getElementById('custom-input').addEventListener('keydown', (e) => {
                if(e.key === 'Enter') handleCustomAdd();
            });
        }

        // --- Core Logic ---
        function saveData() {
            localStorage.setItem('pm_genius_data_v3', JSON.stringify(state.data));
            localStorage.setItem('pm_genius_presets_v3', JSON.stringify(state.presets));
            renderPreview(); // Update preview whenever data saves
        }

        function updateData(path, value) {
            let current = state.data;
            const keys = path.split('.');
            const lastKey = keys.pop();
            
            keys.forEach(key => {
                if (!current[key]) current[key] = {};
                current = current[key];
            });
            
            // Toggle/Append logic for tags vs Direct set for text
            const currentVal = current[lastKey];
            if (typeof value === 'string' && currentVal && !currentVal.includes(value) && path.includes('.')) {
                current[lastKey] = `${currentVal}, ${value}`;
            } else {
                current[lastKey] = value;
            }
            
            saveData();
            
            // If we updated text directly, we don't need full re-render. 
            // If we added a tag via click, we should re-render to show active state.
            if(path.includes('.')) renderForm(); 
        }

        function handleTextChange(path, value) {
            let current = state.data;
            const keys = path.split('.');
            const lastKey = keys.pop();
            keys.forEach(key => { if (!current[key]) current[key] = {}; current = current[key]; });
            current[lastKey] = value;
            saveData(); // No re-render needed for text inputs to avoid focus loss
        }

        function addPreset(path, tag) {
            let current = state.presets;
            const keys = path.split('.');
            const lastKey = keys.pop();
            keys.forEach(key => current = current[key]);
            
            if (!current[lastKey].includes(tag)) {
                current[lastKey].push(tag);
                saveData();
                renderForm(); // Re-render to show new tag
            }
        }

        // --- Render Functions ---

        function renderApp() {
            renderSidebar();
            renderForm();
            renderPreview();
            updateTheme();
            lucide.createIcons();
        }

        function updateTheme() {
            const config = tabConfig[state.activeTab];
            const glow = document.getElementById('ambient-glow');
            // Remove old classes and add new ones (simple string replacement for simplicity)
            glow.className = `absolute -top-1/4 -left-1/4 w-1/2 h-1/2 rounded-full opacity-10 blur-[120px] transition-colors duration-700 ${config.bg}`;
            
            // Update Custom Input Label Color
            const inputEl = document.getElementById('custom-input');
            inputEl.placeholder = `Add custom to ${state.activeTab}...`;
        }

        function renderSidebar() {
            const nav = document.getElementById('nav-container');
            nav.innerHTML = Object.entries(tabConfig).map(([key, config]) => {
                const active = state.activeTab === key;
                return `
                <button onclick="switchTab('${key}')" class="flex flex-col items-center gap-2 p-3 rounded-xl transition-all w-full relative group">
                    <div class="transition-all duration-300 ${active ? `${config.color} scale-110 drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]` : 'text-white/40 group-hover:text-white group-hover:scale-110'}">
                        <i data-lucide="${config.icon}"></i>
                    </div>
                    <span class="text-[9px] font-bold uppercase tracking-widest ${active ? 'text-white' : 'text-white/30 group-hover:text-white/70'}">${key}</span>
                    ${active ? `<div class="absolute left-0 top-1/2 -translate-y-1/2 w-0.5 h-8 ${config.bg} rounded-r-full shadow-[0_0_10px_currentColor]"></div>` : ''}
                </button>
                `;
            }).join('') + '<div class="w-8 h-px bg-white/10 my-2"></div>';
        }

        function renderForm() {
            const container = document.getElementById('form-content');
            const { activeTab, presets, data } = state;
            const theme = tabConfig[activeTab];
            let html = '';

            if (activeTab === 'scene') {
                html += renderSection('Core Concept', data.scene.description, 'scene.description', theme.color);
                html += renderTagGroup('Setting', presets.scene.setting, 'scene.environment.setting', 'scene.setting', data.scene.environment.setting, 'text-cyan-300');
                // Added Time of Day section here
                html += renderTagGroup('Time of Day', presets.style.lighting.time, 'style.lighting.time_of_day', 'style.lighting.time', data.style.lighting.time_of_day, 'text-cyan-300');
                html += renderTagGroup('Details', presets.scene.details, 'scene.environment.details', 'scene.details', data.scene.environment.details, 'text-cyan-300');
                html += renderTagGroup('Atmosphere', presets.scene.pacing, 'scene.pacing', 'scene.pacing', data.scene.pacing, 'text-cyan-300');
            } else if (activeTab === 'camera') {
                html += renderSection('Camera Setup', data.camera.composition, 'camera.composition', theme.color);
                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
                html += renderTagGroup('Shot', presets.camera.composition, 'camera.composition', 'camera.composition', data.camera.composition, 'text-purple-300');
                html += renderTagGroup('Lens', presets.camera.lens, 'camera.lens', 'camera.lens', data.camera.lens, 'text-purple-300');
                html += `<div class="md:col-span-2">` + renderTagGroup('Depth', presets.camera.depth, 'camera.depth_of_field', 'camera.depth', data.camera.depth_of_field, 'text-purple-300') + `</div>`;
                html += `</div>`;
            } else if (activeTab === 'style') {
                html += renderTagGroup('Medium', presets.style.medium, 'style.medium', 'style.medium', data.style.medium, 'text-pink-300');
                html += renderSection('Style Description', data.style.visualStyle, 'style.visualStyle', theme.color);
                html += renderTagGroup('Art Style', presets.style.visualStyle, 'style.visualStyle', 'style.visualStyle', data.style.visualStyle, 'text-pink-300');
                html += renderTagGroup('Artist', presets.style.artist, 'style.artist', 'style.artist', data.style.artist, 'text-pink-300');
                
                html += `<div class="p-6 border border-white/10 rounded-2xl bg-white/5 backdrop-blur-md mt-6 shadow-lg">
                    <h3 class="text-pink-400 font-bold mb-6 uppercase text-xs tracking-widest flex items-center gap-2"><i data-lucide="sparkles" class="w-3 h-3"></i> Detailed Lighting</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        ${renderTagGroup('Mood', presets.style.lighting.mood, 'style.lighting.mood', 'style.lighting.mood', data.style.lighting.mood, 'text-pink-300')}
                        <div class="md:col-span-2">${renderColorPaletteGroup('Color Palette', presets.style.lighting.palette, 'style.lighting.colorPalette', 'style.lighting.palette', data.style.lighting.colorPalette)}</div>
                    </div>
                </div>`;
                
                html += `<div class="mt-6">` + renderTagGroup('Effects', presets.style.filter, 'style.filter', 'style.filter', data.style.filter, 'text-pink-300') + `</div>`;

            } else if (activeTab === 'actors') {
                html += `<div class="flex justify-between items-center mb-6"><h3 class="text-lg font-bold text-white tracking-wide">Cast List</h3><button onclick="addActor()" class="flex items-center gap-2 text-xs bg-yellow-500/20 text-yellow-300 px-4 py-2 rounded-full border border-yellow-500/30"><i data-lucide="plus" class="w-3 h-3"></i> Add Actor</button></div>`;
                
                data.actors.forEach((actor, index) => {
                    html += `
                    <div class="bg-white/5 backdrop-blur-md rounded-xl p-6 border border-white/10 relative group mb-6">
                        <div class="absolute top-4 right-4 opacity-100 group-hover:opacity-100 transition-opacity">
                            ${data.actors.length > 1 ? `<button onclick="removeActor(${index})" class="text-white/40 hover:text-red-400 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                        </div>
                        <div class="mb-4">
                            <label class="text-[10px] text-white/50 uppercase font-bold mb-1 block tracking-widest">ID</label>
                            <input value="${actor.id}" oninput="handleActorChange(${index}, 'id', this.value)" class="bg-black/30 border border-white/10 rounded px-3 py-1 text-xs w-32 text-yellow-400 font-mono outline-none">
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="text-xs text-white/70 uppercase font-bold mb-2 block tracking-wider">Description</label>
                                <textarea oninput="handleActorChange(${index}, 'description', this.value)" class="w-full bg-black/30 border border-white/10 rounded-lg p-3 text-sm h-24 resize-none text-white focus:border-yellow-500/50 outline-none" placeholder="Traits...">${actor.description}</textarea>
                            </div>
                            <div>
                                <label class="text-xs text-white/70 uppercase font-bold mb-2 block tracking-wider">Action</label>
                                <textarea oninput="handleActorChange(${index}, 'action', this.value)" class="w-full bg-black/30 border border-white/10 rounded-lg p-3 text-sm h-24 resize-none text-white focus:border-yellow-500/50 outline-none" placeholder="Doing what?">${actor.action}</textarea>
                            </div>
                        </div>
                        <div class="space-y-3 bg-black/20 p-4 rounded-lg border border-white/5">
                            <div class="text-[10px] text-white/40 font-bold uppercase tracking-widest">Quick Tags</div>
                            <div class="flex flex-wrap gap-2">
                                ${presets.actors.quantity.map(t => `<button onclick="handleActorChange(${index}, 'description', '${t}', true)" class="text-[10px] bg-white/5 hover:bg-white/10 border border-white/10 px-2 py-1 rounded text-white/60 hover:text-white">${t}</button>`).join('')}
                            </div>
                        </div>
                    </div>`;
                });

            } else if (activeTab === 'negative') {
                html += `
                <div class="bg-red-500/5 border border-red-500/20 p-6 rounded-2xl backdrop-blur-md mb-6">
                    <h3 class="flex items-center gap-2 text-red-400 font-bold uppercase text-xs tracking-wider mb-2"><i data-lucide="ban" class="w-3 h-3"></i> Exclusions</h3>
                    <textarea oninput="handleTextChange('negative_prompt', this.value)" class="w-full bg-black/30 border border-white/10 rounded-lg p-3 text-sm text-red-200 focus:border-red-500/50 outline-none min-h-[120px]" placeholder="e.g. blurry, distorted...">${data.negative_prompt}</textarea>
                </div>
                ${renderTagGroup('Common', presets.negative, 'negative_prompt', 'negative', data.negative_prompt, 'text-red-300')}
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        // --- Component Helpers (HTML Generators) ---
        
        function renderSection(title, value, path, colorClass) {
            return `
            <div class="mb-6">
                <div class="flex justify-between items-baseline mb-2">
                    <label class="text-xs font-bold uppercase tracking-widest ${colorClass}">${title}</label>
                </div>
                <textarea oninput="handleTextChange('${path}', this.value)" class="w-full bg-black/30 border border-white/10 rounded-xl p-4 text-sm text-white focus:border-white/50 focus:outline-none transition-all min-h-[100px] shadow-inner" placeholder="...">${value}</textarea>
            </div>`;
        }

        function renderTagGroup(title, tags, updatePath, addPath, currentValue, accentColor) {
            const tagBtns = tags.map(t => {
                const isActive = currentValue && currentValue.includes(t);
                const activeClasses = `bg-white/10 border-white/40 ${accentColor} shadow-[0_0_15px_rgba(0,0,0,0.5)] scale-105`;
                const inactiveClasses = `bg-white/5 border-white/5 text-white/50 hover:border-white/20 hover:text-white hover:bg-white/10`;
                return `<button onclick="updateData('${updatePath}', '${t}')" class="px-3 py-2 rounded-lg text-xs font-medium transition-all border backdrop-blur-sm ${isActive ? activeClasses : inactiveClasses}">${t}</button>`;
            }).join('');

            return `
            <div class="mb-2">
                <div class="mb-3"><label class="text-[10px] font-bold text-white/40 uppercase tracking-[0.15em] block">${title}</label></div>
                <div class="flex flex-wrap gap-2">
                    ${tagBtns}
                    <button onclick="promptAddPreset('${addPath}')" class="px-3 py-2 rounded-lg text-xs font-medium border border-dashed border-white/10 text-white/30 hover:text-white transition-colors"><i data-lucide="plus" class="w-3 h-3"></i></button>
                </div>
            </div>`;
        }

        function renderColorPaletteGroup(title, tags, updatePath, addPath, currentValue) {
            const colorMap = {
                "Teal & Orange": "linear-gradient(135deg, #0d9488 0%, #f97316 100%)",
                "Neon & Black": "linear-gradient(135deg, #10b981 0%, #000000 50%, #d946ef 100%)",
                "Pastel": "linear-gradient(135deg, #fbcfe8 0%, #c7d2fe 100%)",
                "Monochrome": "linear-gradient(135deg, #334155 0%, #cbd5e1 100%)",
                "Warm Earth Tones": "linear-gradient(135deg, #78350f 0%, #d97706 100%)"
            };

            const btns = tags.map(t => {
                const isActive = currentValue && currentValue.includes(t);
                const bg = colorMap[t] || "linear-gradient(135deg, #333 0%, #555 100%)";
                const activeClass = isActive ? 'ring-2 ring-white scale-105 z-10' : 'opacity-70 hover:opacity-100 hover:scale-[1.02]';
                return `
                <button onclick="updateData('${updatePath}', '${t}')" class="h-12 rounded-lg text-xs font-bold transition-all relative overflow-hidden group shadow-lg ${activeClass}" style="background: ${bg}">
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-black/0 transition-colors"></div>
                    <span class="relative z-10 text-white drop-shadow-md tracking-wide">${t}</span>
                </button>`;
            }).join('');

            return `
            <div class="mb-2">
                <div class="mb-4"><label class="text-[10px] font-bold text-white/40 uppercase tracking-[0.15em] block">${title}</label></div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    ${btns}
                    <button onclick="promptAddPreset('${addPath}')" class="h-12 rounded-lg text-xs font-medium border border-dashed border-white/20 text-white/30 hover:text-white flex items-center justify-center gap-2"><i data-lucide="plus" class="w-3 h-3"></i> Add Color</button>
                </div>
            </div>`;
        }

        // --- Logic & Events ---

        function switchTab(tab) {
            state.activeTab = tab;
            renderApp();
        }

        function setOutputMode(mode) {
            state.outputMode = mode;
            // Update UI buttons active state
            const textBtn = document.getElementById('btn-mode-text');
            const jsonBtn = document.getElementById('btn-mode-json');
            const activeClass = "bg-white/10 text-white shadow-sm";
            const inactiveClass = "text-white/40 hover:text-white";
            const jsonActiveClass = "bg-emerald-500/20 text-emerald-400 shadow-sm";
            
            if(mode === 'text') {
                textBtn.className = `px-3 py-1 text-[10px] font-bold rounded-md uppercase tracking-wide transition-all ${activeClass}`;
                jsonBtn.className = `px-3 py-1 text-[10px] font-bold rounded-md uppercase tracking-wide transition-all ${inactiveClass}`;
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-white";
                document.getElementById('status-text').innerText = "Generator Ready";
            } else {
                textBtn.className = `px-3 py-1 text-[10px] font-bold rounded-md uppercase tracking-wide transition-all ${inactiveClass}`;
                jsonBtn.className = `px-3 py-1 text-[10px] font-bold rounded-md uppercase tracking-wide transition-all ${jsonActiveClass}`;
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500";
                document.getElementById('status-text').innerText = "API Ready";
            }
            renderPreview();
        }

        function generateTextString() {
            const { scene, camera, style, actors, negative_prompt } = state.data;
            const parts = [];

            let sceneText = "";
            if (style.medium) sceneText += `${style.medium} of `;
            if (scene.description) sceneText += `${scene.description}. `;
            if (scene.environment.setting) sceneText += `Setting: ${scene.environment.setting}. `;
            if (scene.environment.details) sceneText += `Details: ${scene.environment.details}. `;
            if (scene.pacing) sceneText += `Atmosphere: ${scene.pacing}. `;
            if (sceneText) parts.push(sceneText);

            if (actors.length > 0) {
                const actorText = actors.map(a => `${a.id ? `${a.id}: ` : ""}${a.description || "A subject"} ${a.action ? `doing: ${a.action}` : ""}`).join(". ");
                parts.push(`Subject: ${actorText}.`);
            }

            const cam = [camera.composition, camera.lens, camera.depth_of_field].filter(Boolean).join(", ");
            if (cam) parts.push(`Camera: ${cam}.`);

            const styleTxt = [style.visualStyle, style.artist ? `by ${style.artist}` : null, style.lighting.time_of_day, style.lighting.mood, style.lighting.colorPalette, style.filter].filter(Boolean).join(", ");
            if (styleTxt) parts.push(`Style & Tech: ${styleTxt}.`);

            let final = parts.join("\n\n");
            if (negative_prompt) final += `\n\n--no ${negative_prompt}`;
            
            return final.trim();
        }

        function renderPreview() {
            const text = generateTextString();
            const json = JSON.stringify(state.data, null, 2);
            
            // Desktop Preview
            const container = document.getElementById('preview-content');
            if (state.outputMode === 'text') {
                container.innerText = text || "Start creative flow...";
                container.className = "font-sans text-sm text-slate-300 leading-relaxed whitespace-pre-wrap";
            } else {
                container.innerText = json;
                container.className = "font-mono text-xs text-emerald-400 whitespace-pre-wrap leading-relaxed";
            }

            // Mobile Preview Content
            const mobileContainer = document.getElementById('mobile-preview-content');
            if (mobileContainer) {
                mobileContainer.innerText = state.outputMode === 'text' ? text : json;
            }
        }

        // --- Actors Logic ---
        function addActor() {
            state.data.actors.push({ id: `actor_0${state.data.actors.length + 1}`, description: "", action: "" });
            saveData();
            renderForm();
        }

        function removeActor(index) {
            state.data.actors.splice(index, 1);
            saveData();
            renderForm();
        }

        function handleActorChange(index, field, value, append = false) {
            const actor = state.data.actors[index];
            if (append && actor[field] && !actor[field].includes(value)) {
                actor[field] = `${actor[field]}, ${value}`;
            } else {
                actor[field] = value;
            }
            saveData();
            if(append) renderForm(); // Re-render for tag feedback
        }

        // --- Features ---
        function promptAddPreset(path) {
            const val = prompt("Enter new tag name:");
            if(val) addPreset(path, val.trim());
        }

        function handleCustomAdd() {
            const val = document.getElementById('custom-input').value;
            if(!val) return;
            
            const map = {
                scene: 'scene.description',
                camera: 'camera.composition',
                style: 'style.visualStyle',
                negative: 'negative_prompt'
            };

            if (state.activeTab === 'actors' && state.data.actors.length > 0) {
                handleActorChange(state.data.actors.length - 1, 'description', val, true);
            } else if (map[state.activeTab]) {
                updateData(map[state.activeTab], val);
            }
            
            document.getElementById('custom-input').value = "";
        }

        function toggleMobilePreview() {
            const el = document.getElementById('mobile-preview');
            el.classList.toggle('hidden');
        }

        function copyToClipboard() {
            const content = state.outputMode === 'json' ? JSON.stringify(state.data, null, 2) : generateTextString();
            navigator.clipboard.writeText(content);
            alert("Copied to clipboard!");
        }

        function downloadOutput() {
            const isJson = state.outputMode === 'json';
            const content = isJson ? JSON.stringify(state.data, null, 2) : generateTextString();
            const ext = isJson ? 'json' : 'txt';
            const mime = isJson ? 'application/json' : 'text/plain';
            downloadFile(content, `prompt_master_${new Date().toISOString().slice(0,10)}.${ext}`, mime);
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Boot
        init();
    </script>
</body>
</html>
